<div class="card">
    <p-toast />

    <div class="flex flex-col gap-1 mb-4">
        <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0">Listado de la Flota</h1>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button
                *ngIf="vehiculoSelected() && vehiculoSelected().length > 0"
                label="Eliminar Seleccionados"
                icon="pi pi-trash"
                severity="secondary"
                (onClick)="deleteSelectedVehiculos()" />
        </ng-template>

        <ng-template #end>
            <p-button label="Nuevo Vehículo" icon="pi pi-plus" severity="success" (onClick)="openNew()" />
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="vehiculos()"
        [(selection)]="vehiculoSelected"
        dataKey="id"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['placa', 'marca', 'modelo', 'tipo']"
        [tableStyle]="{ 'min-width': '75rem' }"
    >
        <ng-template #caption>
            <div class="flex flex-wrap gap-2 items-center justify-between">
                <span class="text-xl font-semibold text-surface-900 dark:text-surface-0">Unidades en Distribución</span>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar por placa o marca..." />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
                <th style="width: 6rem">Vista</th>
                <th pSortableColumn="placa" style="min-width:9rem">Placa <p-sortIcon field="placa" /></th>
                <th pSortableColumn="marca" style="min-width:10rem">Marca <p-sortIcon field="marca" /></th>
                <th pSortableColumn="capacidadPallets" style="min-width:9rem">Cap. Pallets <p-sortIcon field="capacidadPallets" /></th>
                <th pSortableColumn="pesoMaximo" style="min-width:9rem">Peso Máx Kg<p-sortIcon field="pesoMaximo" /></th>
                <th pSortableColumn="tipoCaja" style="min-width:11rem">Estructura <p-sortIcon field="tipoCaja" /></th>
                <th pSortableColumn="estado" style="min-width:9rem">Estado <p-sortIcon field="estado" /></th>
                <th style="min-width:10rem">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-carro>
            <tr>
                <td><p-tableCheckbox [value]="carro" /></td>
                <td>
                    <img *ngIf="carro.imagen" [src]="carro.imagen" [alt]="carro.modelo || 'Vehículo'" [title]="carro.modelo || 'Vehículo'" class="w-12 h-12 rounded shadow-md object-cover border border-surface-200 dark:border-surface-700" />
                    <div *ngIf="!carro.imagen" class="w-12 h-12 rounded shadow-md bg-surface-100 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 flex items-center justify-center">
                        <i [ngClass]="{
                            'pi pi-car': carro.tipo === 'CARRO',
                            'pi pi-directions': carro.tipo === 'MOTO',
                            'pi pi-truck': carro.tipo === 'CAMION' || !carro.tipo
                        }" class="text-xl text-surface-500 dark:text-surface-400"></i>
                    </div>
                </td>
                <td class="font-bold text-surface-900 dark:text-surface-0">{{ carro.placa }}</td>
                <td>
                    <div class="flex flex-col">
                        <span class="font-medium text-surface-900 dark:text-surface-0">{{ carro.marca }}</span>
                        <span class="text-xs text-surface-500">{{ carro.modelo }} ({{ carro.anio }})</span>
                    </div>
                </td>
                <td class="font-semibold text-center">{{ carro.capacidadPallets || 0 }} Pallets</td>
                <td class="font-semibold">{{ carro.pesoMaximo | number }} Kg</td>
                <td>
                    <p-tag [value]="getLabelCaja(carro.tipoCaja)" [severity]="getSeverityCaja(carro.tipoCaja)" />
                </td>
                <td>
                    <p-tag [value]="carro.estado" [severity]="getSeverity(carro.estado)" />
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-gauge" severity="info" rounded outlined (onClick)="verDetalleKilometraje(carro)" pTooltip="Historial de KM" />
                        <p-button icon="pi pi-pencil" severity="success" rounded outlined (onClick)="editVehiculo(carro)" pTooltip="Editar Datos" />
                        <p-button icon="pi pi-trash" severity="danger" rounded outlined (onClick)="deleteVehiculo(carro)" pTooltip="Remover" />
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-vehiculo-dialog
    [(visible)]="isDialogOpen"
    [vehiculoData]="vehiculoParaModificar()"
    (onSave)="handleSaveVehiculo($event)">
</app-vehiculo-dialog>

<p-confirmdialog />
