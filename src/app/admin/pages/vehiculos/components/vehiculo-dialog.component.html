<p-dialog
    [(visible)]="visible"
    [style]="{ width: '500px' }"
    [header]="vehiculo.id ? 'Modificar Especificaciones de Unidad' : 'Registrar Nueva Unidad en Flota'"
    [modal]="true">

    <ng-template #content>
        <p-fluid class="flex flex-col gap-4 pt-2">

            <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" class="mb-2"></p-message>

            <div class="flex flex-col gap-2">
                <label for="tipo" class="font-semibold">Tipo de Unidad <span class="text-red-500">*</span></label>
                <p-select
                    id="tipo"
                    [(ngModel)]="vehiculo.tipo"
                    [options]="tiposVehiculo"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Seleccionar tipo de transporte"
                    (onChange)="onTipoVehiculoChange()"
                    appendTo="body">
                </p-select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="placa" class="font-semibold">Placa Venezolana <span class="text-red-500">*</span></label>
                    <input
                        pInputText
                        id="placa"
                        [(ngModel)]="vehiculo.placa"
                        placeholder="Ej: AB123CD"
                        maxlength="9"
                        [disabled]="!!vehiculo.id"
                        class="uppercase" />
                </div>
                <div class="flex flex-col gap-2">
                    <label for="marca" class="font-semibold">Marca <span class="text-red-500">*</span></label>
                    <input pInputText id="marca" [(ngModel)]="vehiculo.marca" placeholder="Ej: Chevrolet" />
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="modelo" class="font-semibold">Modelo <span class="text-red-500">*</span></label>
                    <input pInputText id="modelo" [(ngModel)]="vehiculo.modelo" placeholder="Ej: NPR Cava" />
                </div>
                <div class="flex flex-col gap-2">
                    <label for="anio" class="font-semibold">Año <span class="text-red-500">*</span></label>
                    <p-inputnumber
                        id="anio"
                        [(ngModel)]="vehiculo.anio"
                        [useGrouping]="false"
                        [maxlength]="4"
                        placeholder="Ej: 2024" />
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="imagen" class="font-semibold text-surface-500 dark:text-surface-400">Imagen del Vehículo (Opcional - URL)</label>
                <input pInputText id="imagen" [(ngModel)]="vehiculo.imagen" placeholder="https://ejemplo.com/foto-camion.jpg" />
            </div>

            <div class="font-semibold text-lg border-b border-surface-200 dark:border-surface-700 pb-1 mt-2">Capacidades de Carga</div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="pallets" class="font-semibold">Capacidad de Pallets <span class="text-red-500">*</span></label>
                    <p-inputnumber
                        id="pallets"
                        [(ngModel)]="vehiculo.capacidadPallets"
                        [min]="0"
                        [disabled]="vehiculo.tipo === 'CARRO' || vehiculo.tipo === 'MOTO'"
                        placeholder="Cantidad" />
                    <small *ngIf="vehiculo.tipo === 'CARRO' || vehiculo.tipo === 'MOTO'" class="text-surface-400 italic">
                        Bloqueado: Automóviles/Motos cargan 0 pallets.
                    </small>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="peso" class="font-semibold">Peso Máximo Soportado (Kg) <span class="text-red-500">*</span></label>
                    <p-inputnumber id="peso" [(ngModel)]="vehiculo.pesoMaximo" [min]="0" placeholder="Capacidad en Kg" />
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="tipoCaja" class="font-semibold">Tipo de Estructura / Caja <span class="text-red-500">*</span></label>
                <p-select
                    id="tipoCaja"
                    [(ngModel)]="vehiculo.tipoCaja"
                    [options]="tiposCaja"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Seleccionar Estructura"
                    [disabled]="vehiculo.tipo === 'CARRO' || vehiculo.tipo === 'MOTO'"
                    appendTo="body">
                </p-select>
                <small *ngIf="vehiculo.tipo === 'CARRO' || vehiculo.tipo === 'MOTO'" class="text-surface-400 italic">
                    Bloqueado: Por defecto Caja Seca.
                </small>
            </div>

            <div class="flex flex-col gap-2">
                <label for="estado" class="font-semibold">Estado Operativo <span class="text-red-500">*</span></label>
                <p-select
                    id="estado"
                    [(ngModel)]="vehiculo.estado"
                    [options]="estados"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Seleccionar Estado"
                    appendTo="body">
                </p-select>
            </div>
        </p-fluid>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" text (onClick)="hideDialog()" />
        <p-button [label]="vehiculo.id ? 'Guardar Cambios' : 'Registrar Unidad'" icon="pi pi-check" (onClick)="save()" />
    </ng-template>
</p-dialog>
