<p-dialog
    [(visible)]="visible"
    [style]="{ width: '700px' }"
    [header]="
        vehiculoData().id_vehiculo || vehiculoData().id
            ? 'Modificar Especificaciones de Unidad'
            : 'Registrar Nueva Unidad en Flota'
    "
    [modal]="true"
>
    <ng-template #content>
        <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
            <p-message
                *ngIf="errorMessage"
                severity="error"
                [text]="errorMessage"
                class="mb-2"
            ></p-message>

            <p-fluid>
                <div
                    class="font-semibold text-md border-b border-surface-200 dark:border-surface-700 pb-1"
                >
                    Datos de la Unidad
                </div>

                <div class="flex flex-col gap-2">
                    <label for="tipo" class="font-semibold"
                        >Tipo de Unidad <span class="text-red-500">*</span></label
                    >
                    <p-select
                        id="tipo"
                        formControlName="tipo"
                        [options]="tiposVehiculo"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Seleccionar tipo de transporte"
                        appendTo="body"
                    >
                    </p-select>
                </div>

                <div class="grid grid-cols-12 gap-3 mt-2">
                    <div class="col-span-6 flex flex-col gap-2">
                        <label for="placa" class="font-semibold"
                            >Placa Venezolana <span class="text-red-500">*</span></label
                        >
                        <input
                            pInputText
                            id="placa"
                            formControlName="placa"
                            placeholder="Ej: AB123CD"
                            maxlength="9"
                            class="uppercase"
                        />
                        <small
                            *ngIf="submitted && form.get('placa')?.errors?.['required']"
                            class="text-red-500"
                            >La placa es obligatoria</small
                        >
                        <small
                            *ngIf="submitted && form.get('placa')?.errors?.['pattern']"
                            class="text-red-500"
                            >Formato inválido</small
                        >
                    </div>
                    <div class="col-span-6 flex flex-col gap-2">
                        <label for="marca" class="font-semibold"
                            >Marca <span class="text-red-500">*</span></label
                        >
                        <input
                            pInputText
                            id="marca"
                            formControlName="marca"
                            placeholder="Ej: Chevrolet"
                        />
                    </div>
                </div>

                <div class="grid grid-cols-12 gap-3 mt-2">
                    <div class="col-span-6 flex flex-col gap-2">
                        <label for="modelo" class="font-semibold"
                            >Modelo <span class="text-red-500">*</span></label
                        >
                        <input
                            pInputText
                            id="modelo"
                            formControlName="modelo"
                            placeholder="Ej: NPR Cava"
                        />
                    </div>
                    <div class="col-span-6 flex flex-col gap-2">
                        <label for="anio" class="font-semibold"
                            >Año <span class="text-red-500">*</span></label
                        >
                        <p-inputnumber
                            id="anio"
                            formControlName="anio"
                            [useGrouping]="false"
                            [maxlength]="4"
                            placeholder="Ej: 2024"
                        />
                    </div>
                </div>
            </p-fluid>

            <p-divider />

            <p-fluid>
                <div
                    class="font-semibold text-md border-b border-surface-200 dark:border-surface-700 pb-1"
                >
                    Capacidades de Carga
                </div>

                <div class="grid grid-cols-12 gap-3 mt-2">
                    <div
                        class="flex flex-col gap-2"
                        [ngClass]="esCamion() ? 'col-span-6' : 'col-span-12'"
                    >
                        <label for="peso" class="font-semibold"
                            >Peso Máximo (Kg) <span class="text-red-500">*</span></label
                        >
                        <p-inputnumber
                            id="peso"
                            formControlName="pesoMaximo"
                            [min]="0"
                            placeholder="Capacidad en Kg"
                        />
                    </div>
                    <div class="col-span-6 flex flex-col gap-2" *ngIf="esCamion()">
                        <label for="pallets" class="font-semibold"
                            >Capacidad de Pallets <span class="text-red-500">*</span></label
                        >
                        <p-inputnumber
                            id="pallets"
                            formControlName="capacidadPallets"
                            [min]="0"
                            placeholder="Cantidad"
                        />
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-2" *ngIf="esCamion()">
                    <label for="tipoCaja" class="font-semibold"
                        >Tipo de Estructura / Caja <span class="text-red-500">*</span></label
                    >
                    <p-select
                        id="tipoCaja"
                        formControlName="tipoCaja"
                        [options]="tiposCaja"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Seleccionar Estructura"
                        appendTo="body"
                    >
                    </p-select>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <label for="estado" class="font-semibold"
                        >Estado Operativo <span class="text-red-500">*</span></label
                    >
                    <p-select
                        id="estado"
                        formControlName="estado"
                        [options]="estados"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Seleccionar Estado"
                        appendTo="body"
                    >
                    </p-select>
                </div>
            </p-fluid>

            <p-divider />

            <p-fluid>
                <div
                    class="font-semibold text-md border-b border-surface-200 dark:border-surface-700 pb-1"
                >
                    Imagen del Vehículo
                </div>

                <div *ngIf="!uploadedImageUrl" class="flex flex-col gap-2 mt-2">
                    <p-fileUpload
                        mode="basic"
                        name="imagen"
                        accept="image/*"
                        [maxFileSize]="5000000"
                        chooseLabel="Seleccionar imagen"
                        (onSelect)="onImageUpload($event)"
                        [auto]="true"
                        [disabled]="uploadingImage"
                    >
                    </p-fileUpload>
                    <small class="text-surface-400 italic">
                        Formatos: JPG, PNG, WEBP. Máximo 5MB.
                    </small>
                </div>

                <div *ngIf="uploadedImageUrl" class="flex flex-col gap-2 mt-2">
                    <div
                        class="relative inline-block w-48 h-36 rounded-lg overflow-hidden border border-surface-200 dark:border-surface-700"
                    >
                        <img
                            [src]="uploadedImageUrl"
                            alt="Vehículo"
                            class="w-full h-full object-cover"
                        />
                    </div>
                    <p-button
                        label="Eliminar imagen"
                        icon="pi pi-trash"
                        severity="danger"
                        size="small"
                        (onClick)="removeImage()"
                    />
                </div>
            </p-fluid>
        </form>
    </ng-template>

    <ng-template #footer>
        <p-button
            label="Cancelar"
            icon="pi pi-times"
            text
            (onClick)="hideDialog()"
            [disabled]="loading"
        />
        <p-button
            [label]="
                vehiculoData().id_vehiculo || vehiculoData().id
                    ? 'Guardar Cambios'
                    : 'Registrar Unidad'
            "
            icon="pi pi-check"
            [loading]="loading"
            (onClick)="save()"
        />
    </ng-template>
</p-dialog>
