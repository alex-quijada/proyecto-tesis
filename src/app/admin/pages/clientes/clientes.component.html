<div class="card">
    <p-toast />

    <div class="flex flex-col gap-1 mb-4">
        <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0">Gestión de Clientes</h1>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button
                *ngIf="clienteSelected() && clienteSelected().length > 0"
                label="Eliminar Seleccionados"
                icon="pi pi-trash"
                severity="secondary"
                (onClick)="deleteSelectedClientes()"
            />
        </ng-template>

        <ng-template #end>
            <p-button
                label="Nuevo Cliente"
                icon="pi pi-plus"
                severity="success"
                (onClick)="openNew()"
            />
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="clientes()"
        [(selection)]="clienteSelected"
        dataKey="id"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="[
            'nombreComercial',
            'documentoIdentidad.prefijo',
            'documentoIdentidad.numero',
        ]"
        [tableStyle]="{ 'min-width': '75rem' }"
    >
        <ng-template #caption>
            <div class="flex flex-wrap gap-2 items-center justify-between">
                <span class="text-xl font-semibold text-surface-900 dark:text-surface-0"
                    >Clientes Registrados</span
                >
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input
                        pInputText
                        type="text"
                        (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                        placeholder="Buscar cliente..."
                    />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
                <th pSortableColumn="nombreComercial" style="min-width: 13rem">
                    Nombre Comercial <p-sortIcon field="nombreComercial" />
                </th>
                <th pSortableColumn="documentoIdentidad" style="min-width: 10rem">
                    RIF / Cédula <p-sortIcon field="documentoIdentidad" />
                </th>
                <th style="min-width: 8rem">Teléfono</th>
                <th pSortableColumn="prioridad" style="min-width: 7rem">
                    Prioridad <p-sortIcon field="prioridad" />
                </th>
                <th style="min-width: 16rem">Ubicaciones</th>
                <th style="min-width: 8rem">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-cliente>
            <tr>
                <td><p-tableCheckbox [value]="cliente" /></td>
                <td class="font-bold text-surface-900 dark:text-surface-0">
                    {{ cliente.nombreComercial }}
                </td>
                <td>
                    <span
                        class="font-mono text-sm bg-surface-100 dark:bg-surface-800 px-2 py-1 rounded"
                    >
                        {{ getDocumentoDisplay(cliente) }}
                    </span>
                </td>
                <td class="text-sm">{{ cliente.telefono || '-' }}</td>
                <td>
                    <p-tag
                        [value]="cliente.prioridad"
                        [severity]="getSeverity(cliente.prioridad || '')"
                    />
                </td>
                <td>
                    <div class="flex flex-col gap-1">
                        <div *ngFor="let ub of cliente.ubicaciones" class="text-sm">
                            <i class="pi pi-map-marker mr-1 text-primary"></i>
                            <span>{{ ub.direccion }}</span>
                            <span *ngIf="ub.municipio" class="text-surface-400 text-xs block ml-4">
                                {{ getMunicipioLabel(ub.municipio) }}
                            </span>
                        </div>
                        <span
                            *ngIf="!cliente.ubicaciones || cliente.ubicaciones.length === 0"
                            class="text-surface-400 italic text-sm"
                        >
                            Sin ubicaciones registradas
                        </span>
                    </div>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button
                            icon="pi pi-pencil"
                            severity="success"
                            rounded
                            outlined
                            (onClick)="editCliente(cliente)"
                            pTooltip="Editar Cliente"
                        />
                        <p-button
                            icon="pi pi-trash"
                            severity="danger"
                            rounded
                            outlined
                            (onClick)="deleteCliente(cliente)"
                            pTooltip="Eliminar"
                        />
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-cliente-dialog
    [(visible)]="isDialogOpen"
    [clienteData]="clienteParaModificar()"
    (onSave)="handleSaveCliente($event)"
>
</app-cliente-dialog>

<p-confirmdialog />
