<div class="card">
    <p-toast />

    <div class="flex flex-col gap-1 mb-4">
        <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0">Gestión de Clientes</h1>
        <p class="text-surface-500">Registra nuevos clientes con sus ubicaciones y reglas de recepción.</p>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #end>
            <p-button
                label="Nuevo Cliente"
                icon="pi pi-plus"
                severity="success"
                (onClick)="openNew()"
            />
        </ng-template>
    </p-toolbar>

    <div class="flex flex-col items-center justify-center py-12 text-surface-400">
        <i class="pi pi-building" style="font-size: 4rem"></i>
        <p class="mt-4 text-lg">Presiona "Nuevo Cliente" para registrar.</p>
    </div>
</div>

<app-cliente-dialog
    [(visible)]="isDialogOpen"
    [clienteData]="clienteParaModificar()"
    (onSave)="handleSaveCliente($event)"
>
</app-cliente-dialog>
