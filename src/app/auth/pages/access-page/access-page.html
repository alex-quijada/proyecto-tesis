<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen p-4"
>
    <div class="w-full max-w-lg">
        <div
            class="bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-3xl p-8 sm:p-12 shadow-xl text-center"
        >
            <!-- Icono de Candado / Alerta -->
            <div
                class="w-20 h-20 rounded-3xl bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center mx-auto mb-6"
            >
                <i class="pi pi-lock text-4xl"></i>
            </div>

            <!-- Título y Descripción -->
            <span
                class="text-xs uppercase font-bold tracking-wider text-amber-600 dark:text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full"
                >Acceso Restringido</span
            >
            <h1
                class="text-3xl sm:text-4xl font-extrabold text-surface-900 dark:text-surface-0 mt-4 mb-3"
            >
                Permisos Insuficientes
            </h1>
            <p
                class="text-surface-600 dark:text-surface-400 text-sm sm:text-base leading-relaxed mb-6"
            >
                Tu cuenta de usuario
                <strong *ngIf="userRole()" class="text-surface-900 dark:text-surface-100">
                    ({{ userRole() }})
                </strong>
                no tiene los privilegios requeridos para acceder a esta sección del sistema.
            </p>

            <!-- Acciones Inteligentes -->
            <div class="flex flex-col gap-3">
                <p-button
                    [label]="destino().label"
                    [icon]="destino().icon"
                    [routerLink]="destino().ruta"
                    severity="primary"
                    [rounded]="true"
                    size="large"
                />

                <p-button
                    *ngIf="userRole()"
                    label="Cerrar Sesión"
                    icon="pi pi-sign-out"
                    (onClick)="cerrarSesion()"
                    [outlined]="true"
                    severity="secondary"
                    [rounded]="true"
                />
            </div>

            <!-- Ayuda / Pie -->
            <div
                class="border-t border-surface-200 dark:border-surface-800 mt-8 pt-4 text-xs text-muted-color"
            >
                ¿Crees que se trata de un error? Contacta al Administrador de BrandIA para solicitar
                acceso.
            </div>
        </div>
    </div>
</div>
