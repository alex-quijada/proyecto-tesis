<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen p-4"
>
    <div class="w-full max-w-lg">
        <div
            class="bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-3xl p-8 sm:p-12 shadow-xl text-center"
        >
            <!-- Icono de Error -->
            <div
                class="w-20 h-20 rounded-3xl bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-center mx-auto mb-6"
            >
                <i class="pi pi-exclamation-triangle text-4xl"></i>
            </div>

            <!-- Título y Descripción -->
            <span
                class="text-xs uppercase font-bold tracking-wider text-rose-600 dark:text-rose-400 bg-rose-500/10 px-3 py-1 rounded-full"
                >Inconveniente Técnico</span
            >
            <h1
                class="text-3xl sm:text-4xl font-extrabold text-surface-900 dark:text-surface-0 mt-4 mb-3"
            >
                Error del Sistema
            </h1>
            <p class="text-surface-600 dark:text-surface-400 text-sm sm:text-base leading-relaxed mb-6">
                Ha ocurrido un problema inesperado al procesar la solicitud. Puede deberse a una pérdida
                temporal de conexión o a una operación no disponible.
            </p>

            <!-- Acciones -->
            <div class="flex flex-col gap-3">
                <p-button
                    label="Reintentar Operación"
                    icon="pi pi-refresh"
                    (onClick)="reintentar()"
                    severity="danger"
                    [rounded]="true"
                    size="large"
                />

                <p-button
                    label="Volver al Inicio"
                    icon="pi pi-home"
                    routerLink="/"
                    [outlined]="true"
                    severity="secondary"
                    [rounded]="true"
                />
            </div>

            <!-- Pie de Diagnóstico -->
            <div class="border-t border-surface-200 dark:border-surface-800 mt-8 pt-4 text-xs text-muted-color">
                Si el problema persiste, verifique su conexión a internet o notifique al equipo de soporte.
            </div>
        </div>
    </div>
</div>
