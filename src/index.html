<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>BrandIA - PrimeNG</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="https://i.ibb.co/vxzNZdt7/B-modified.png" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <script>
            (function () {
                try {
                    var raw =
                        localStorage.getItem('brandia_layout_config') ||
                        localStorage.getItem('sakai_layout_config');
                    if (raw) {
                        var config = JSON.parse(raw);
                        if (config && config.darkTheme) {
                            document.documentElement.classList.add('app-dark');
                        }
                    }
                } catch (e) {}
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
        <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsWW8wQrG_ZT0kxUz04abKG1gXrbPjg_I&libraries=places,marker&loading=async"
            async
        ></script>
    </body>
</html>
